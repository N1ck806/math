{% extends 'base.html' %}
{% block content %}
<article class="prose">
    <div style="text-align: center; padding: 24px 0;">
        <p style="font-size: 3rem; font-weight: 700; color: var(--error); margin: 0 0 8px; line-height: 1;">
            500
        </p>
        <h1 style="margin-top: 0;">Внутренняя ошибка</h1>
        <p class="lead" style="max-width: 46ch; margin-left: auto; margin-right: auto;">

            страницу или вернуться на главную.

        <div class="results-actions" style="justify-content: center;">
            <a class="btn btn-primary" href="{{ url_for('index') }}">
