<article class="formula-card" data-formula-card>
    <header class="formula-card-header">
        <h3>{{ formula.title }}</h3>
        <button class="btn-copy" type="button"
                data-copy-text="{{ formula.text }}"
                aria-label="Скопировать формулу «{{ formula.title }}»">
            <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="9" width="11" height="11" rx="2"
                      fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M5 15V6a2 2 0 0 1 2-2h9"
                      fill="none" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round"/>
            </svg>
            <span data-copy-label>Копировать</span>
        </button>
    </header>

    <div class="formula-body" data-latex="{{ formula.latex }}">
        {{ formula.text }}
    </div>

    <p class="formula-when">{{ formula.when }}</p>
</article>
