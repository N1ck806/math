<div class="progress-block" role="progressbar"
     aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ progress_percent }}"
     aria-label="Учебный прогресс: {{ progress_percent }}%">
    <div class="progress-label">
        <span>Учебный прогресс</span>
        <span>{{ progress_percent }}%</span>
    </div>
    <div class="progress-track">
        <div class="progress-fill"
             style="width: {{ progress_percent }}%;"
             data-progress-fill
             data-progress-value="{{ progress_percent }}"></div>
    </div>
</div>
