<section class="learned-block" aria-labelledby="learned-title">
    <h2 id="learned-title">Что мы узнали</h2>
    <ul>
        {% for item in learned_items %}
        <li>{{ item }}</li>
        {% endfor %}
    </ul>

    {% if mini_task %}
    <div class="mini-task">
        <strong>Мини-задание.</strong> {{ mini_task }}
    </div>
    {% endif %}

    {% if next_url and next_label %}
    <div class="learned-actions">
        <a class="btn btn-primary" href="{{ next_url }}">
            {{ next_label }}
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6"
                      fill="none" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
    </div>
    {% endif %}
</section>
