<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <!-- ============================================================
         Набор SVG-иконок единого стиля для всего проекта.
         Использование: <svg class="icon"><use href="/static/svg/icons.svg#icon-name"/></svg>
         Все иконки: stroke="currentColor", размер 24×24, толщина 2.
         ============================================================ -->

    <!-- Проверка / галочка -->
    <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="M5 13l4 4L19 7" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Крест / ошибка -->
    <symbol id="icon-cross" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Стрелка вправо -->
    <symbol id="icon-arrow-right" viewBox="0 0 24 24">
        <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Стрелка влево -->
    <symbol id="icon-arrow-left" viewBox="0 0 24 24">
        <path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Стрелка вверх -->
    <symbol id="icon-arrow-up" viewBox="0 0 24 24">
        <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Меню (гамбургер) -->
    <symbol id="icon-menu" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Копирование -->
    <symbol id="icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2" fill="none"
              stroke="currentColor" stroke-width="2"/>
        <path d="M5 15V6a2 2 0 0 1 2-2h9" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- График / линия -->
    <symbol id="icon-chart" viewBox="0 0 24 24">
        <path d="M4 20V4M4 20h16" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"/>
        <path d="M7 16l3-5 3 3 4-8 3 5" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Точки эксперимента (scatter) -->
    <symbol id="icon-dots" viewBox="0 0 24 24">
        <circle cx="6"  cy="17" r="1.8" fill="currentColor"/>
        <circle cx="10" cy="13" r="1.8" fill="currentColor"/>
        <circle cx="14" cy="15" r="1.8" fill="currentColor"/>
        <circle cx="18" cy="9"  r="1.8" fill="currentColor"/>
        <path d="M4 20V4M4 20h16" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    </symbol>

    <!-- Формула -->
    <symbol id="icon-formula" viewBox="0 0 24 24">
        <path d="M5 7h4l4 10h6" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 12h4" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Книга / теория -->
    <symbol id="icon-book" viewBox="0 0 24 24">
        <path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2V5z" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M8 3v18" fill="none" stroke="currentColor"
              stroke-width="2" opacity="0.5"/>
    </symbol>

    <!-- Лаборатория / колба -->
    <symbol id="icon-flask" viewBox="0 0 24 24">
        <path d="M9 3h6M10 3v6L5 19a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 19l-5-10V3"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7.5 15h9" fill="none" stroke="currentColor"
              stroke-width="2" opacity="0.5"/>
    </symbol>

    <!-- Вопрос / тест -->
    <symbol id="icon-question" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none"
                stroke="currentColor" stroke-width="2"/>
        <path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8v.3"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
        <circle cx="12" cy="17" r="1" fill="currentColor"/>
    </symbol>

    <!-- Результаты / медаль -->
    <symbol id="icon-award" viewBox="0 0 24 24">
        <circle cx="12" cy="9" r="5" fill="none"
                stroke="currentColor" stroke-width="2"/>
        <path d="M8.5 13.5L7 22l5-2.5L17 22l-1.5-8.5" fill="none"
              stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Смена темы: солнце -->
    <symbol id="icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" fill="none"
                stroke="currentColor" stroke-width="2"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.5 4.5l2.1 2.1M17.4 17.4l2.1 2.1M4.5 19.5l2.1-2.1M17.4 6.6l2.1-2.1"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
    </symbol>

    <!-- Смена темы: луна -->
    <symbol id="icon-moon" viewBox="0 0 24 24">
        <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linejoin="round"/>
    </symbol>

    <!-- Информация -->
    <symbol id="icon-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none"
                stroke="currentColor" stroke-width="2"/>
        <path d="M12 8.5v.01M11 12h1v4h1" fill="none"
              stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
    </symbol>

    <!-- Предупреждение -->
    <symbol id="icon-warning" viewBox="0 0 24 24">
        <path d="M12 3l10 18H2L12 3z" fill="none"
              stroke="currentColor" stroke-width="2"
              stroke-linejoin="round"/>
        <path d="M12 10v5M12 18v.01" fill="none"
              stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
    </symbol>

    <!-- Внешняя ссылка -->
    <symbol id="icon-external" viewBox="0 0 24 24">
        <path d="M14 4h6v6M20 4l-9 9" fill="none"
              stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
    </symbol>
</svg>